<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECHO — read the room on Hacker News</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="glyph">◈</span>
        <span class="name">ECHO</span>
        <span class="tag">read the room</span>
      </div>
      <div class="pulse" id="pulse">
        <span class="pulse-dot"></span>
        <span id="pulse-label">listening to HN…</span>
      </div>
    </header>

    <main class="layout">
      <!-- feed -->
      <section class="feed" id="feed">
        <div class="feed-tabs" id="tabs">
          <button class="tab active" data-feed="top">Top</button>
          <button class="tab" data-feed="new">New</button>
          <button class="tab" data-feed="ask">Ask</button>
          <button class="tab" data-feed="show">Show</button>
          <button class="tab" data-feed="job">Jobs</button>
          <button class="tab sort" data-sort="velocity">⟳ by velocity</button>
        </div>
        <div class="feed-list" id="feed-list">
          <div class="loading">tuning in…</div>
        </div>
      </section>

      <!-- reader -->
      <section class="reader" id="reader">
        <div class="reader-empty" id="reader-empty">
          <div class="reader-glyph">◈</div>
          <p>Pick a story to read the room.</p>
          <p class="hint">Velocity shows how fast comments are arriving — the faster, the louder the debate.</p>
        </div>
        <article class="story" id="story" hidden>
          <div class="story-meta">
            <span class="story-rank" id="s-rank"></span>
            <span class="story-score" id="s-score"></span>
            <span class="story-by" id="s-by"></span>
            <span class="story-age" id="s-age"></span>
          </div>
          <h1 class="story-title" id="s-title"></h1>
          <a class="story-link" id="s-url" target="_blank" rel="noopener"></a>
          <div class="velobar">
            <span class="velo-label">comment velocity</span>
            <div class="velo-track"><div class="velo-fill" id="s-velo"></div></div>
            <span class="velo-num" id="s-velo-num"></span>
          </div>
          <div class="comments" id="comments">
            <div class="loading">loading the conversation…</div>
          </div>
        </article>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
